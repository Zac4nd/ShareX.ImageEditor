name: Raster editor build and smoke tests
on:
  push:
    branches: [feature/raster-selection-editor-ux]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build editor and standalone app
        run: dotnet build ShareX.ImageEditor.sln -p:Platform=x64 --configuration Release
      - name: Run raster regression cases
        run: dotnet run --project tests/ShareX.ImageEditor.RasterTests/ShareX.ImageEditor.RasterTests.csproj -p:Platform=x64 --configuration Release
      - name: Standalone font, theme and layout regressions (Skia, no desktop)
        run: dotnet run --project tests/ShareX.ImageEditor.UiTests/ShareX.ImageEditor.UiTests.csproj -p:Platform=x64 --configuration Release
      - name: Library host font, theme and layout regressions
        run: dotnet run --project tests/ShareX.ImageEditor.UiTests/ShareX.ImageEditor.UiTests.csproj -p:Platform=x64 --configuration Release --no-build -- --library-host
      - name: Publish standalone Windows app
        run: dotnet publish src/ShareX.ImageEditor.App/ShareX.ImageEditor.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/ShareX.ImageEditor-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ShareX-ImageEditor-win-x64
          path: artifacts/ShareX.ImageEditor-win-x64/
      - name: Publish one-click portable preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path artifacts/ShareX.ImageEditor-win-x64/* -DestinationPath ShareX.ImageEditor-win-x64-portable.zip
          $overlayFiles = @(
            'ShareX.ImageEditor.dll',
            'ShareX.ImageEditor.App.exe',
            'ShareX.ImageEditor.App.dll',
            'ShareX.ImageEditor.App.deps.json',
            'ShareX.ImageEditor.App.runtimeconfig.json'
          ) | ForEach-Object { Join-Path 'artifacts/ShareX.ImageEditor-win-x64' $_ }
          foreach ($file in $overlayFiles) { if (-not (Test-Path $file)) { throw "Missing overlay file: $file" } }
          Compress-Archive -Path $overlayFiles -DestinationPath ShareX.ImageEditor-scoop-overlay.zip
          gh release view preview-raster-editor *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload preview-raster-editor ShareX.ImageEditor-win-x64-portable.zip ShareX.ImageEditor-scoop-overlay.zip --clobber
          } else {
            gh release create preview-raster-editor ShareX.ImageEditor-win-x64-portable.zip ShareX.ImageEditor-scoop-overlay.zip --target $env:GITHUB_SHA --title 'Raster editor preview (Windows x64)' --notes 'Portable standalone editor: extract ZIP and run ShareX.ImageEditor.App.exe. Does not replace ShareX installed via Scoop.' --prerelease --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed' }
          gh release view preview-raster-editor --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $names = gh release view preview-raster-editor --json assets --jq '.assets[].name'
          if ($names -notcontains 'ShareX.ImageEditor-scoop-overlay.zip') { throw 'Overlay release asset missing' }
