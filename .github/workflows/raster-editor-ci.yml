name: Raster editor build and smoke tests
on:
  push:
    branches: [feature/raster-selection-editor-ux]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build editor and standalone app
        run: dotnet build ShareX.ImageEditor.sln -p:Platform=x64 --configuration Release
      - name: Run raster regression cases
        run: dotnet run --project tests/ShareX.ImageEditor.RasterTests/ShareX.ImageEditor.RasterTests.csproj -p:Platform=x64 --configuration Release
      - name: Publish standalone Windows app
        run: dotnet publish src/ShareX.ImageEditor.App/ShareX.ImageEditor.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o artifacts/ShareX.ImageEditor-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ShareX-ImageEditor-win-x64
          path: artifacts/ShareX.ImageEditor-win-x64/
